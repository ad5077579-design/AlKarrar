# Backend CI — blocks merges when financial guards or any pytest fails.
# Enable branch protection: require status check "Backend tests (pytest)".
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Financial guard suite
        env:
          ALKARRAR_GRID_BOOTSTRAP_MARKET: "0"
          ALKARRAR_AUTO_DETECT_BINANCE_ENV: "false"
          ALKARRAR_GRID_AUTO_RESUME: "true"
        run: |
          python -m pytest backend/tests -m financial -q --tb=short

      - name: Full backend test suite
        env:
          ALKARRAR_GRID_BOOTSTRAP_MARKET: "0"
          ALKARRAR_AUTO_DETECT_BINANCE_ENV: "false"
          ALKARRAR_GRID_AUTO_RESUME: "true"
          PYTHONWARNINGS: "ignore::DeprecationWarning"
        run: |
          python -m pytest backend/tests -q --tb=short
